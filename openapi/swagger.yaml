host: localhost:3000
info:
  contact:
    email: help@512b.it
    name: DailyTrack
  description: The purpose of this service is to properly track daily activities.
  title: dailytrack
  version: 0.0.1
paths:
  /v1/api_keys:
    get:
      consumes:
      - application/json
      description: List all api keys for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.List-models_ApiKey'
      security:
      - TokenAuth: []
      summary: List api keys
      tags:
      - api_key
    post:
      consumes:
      - application/json
      description: Create an api key for the authenticated user
      parameters:
      - default: default
        description: Name of the api key
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ApiKey'
      security:
      - TokenAuth: []
      summary: Create an api key
      tags:
      - api_key
  /v1/events/{username}/{track_name}:
    get:
      consumes:
      - application/json
      description: List all events for a track
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Track name
        in: path
        name: track_name
        required: true
        type: string
      - description: Created at
        in: query
        name: created_at
        type: string
      - description: Quantity
        in: query
        name: quantity
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.List-models_Day'
      security:
      - ApiKeyAuth: []
      summary: List events
      tags:
      - event
    post:
      consumes:
      - application/json
      description: Create an event for the authenticated user
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Track name
        in: path
        name: track_name
        required: true
        type: string
      - description: Created at
        in: query
        name: created_at
        type: string
      - description: Quantity
        in: query
        name: quantity
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ResponseModel'
      security:
      - ApiKeyAuth: []
      summary: Create an event
      tags:
      - event
  /v1/tracks:
    get:
      consumes:
      - application/json
      description: List all tracks for the authenticated user
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.List-models_Track'
      security:
      - TokenAuth: []
      summary: List tracks
      tags:
      - track
    post:
      consumes:
      - application/json
      description: Create a track
      parameters:
      - description: Track object
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Track'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ResponseModel'
      security:
      - TokenAuth: []
      summary: Create a track
      tags:
      - track
  /v1/users/challenge:
    get:
      consumes:
      - application/json
      description: Create a user challenge given an email address
      parameters:
      - description: The email address of the user
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Challenge'
      summary: Create a user challenge
      tags:
      - user
  /v1/users/signin:
    post:
      consumes:
      - application/json
      description: Sign in a user
      parameters:
      - description: the signed challenge to enter the system
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SignIn'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ResponseModel'
      summary: Sign in a user
      tags:
      - user
  /v1/users/signup:
    post:
      consumes:
      - application/json
      description: Create a new user
      parameters:
      - description: the user body to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ResponseModel'
      summary: Create a user
      tags:
      - user
securityDefinitions:
  ApiKeyAuth:
    in: query
    name: key
    type: apiKey
  TokenAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
