      delete_at:
        type: string
      id:
        type: integer
      key:
        type: string
      name:
        type: string
      user_id:
        type: integer
    type: object
  models.Challenge:
    properties:
      challenge:
        type: string
      salt:
        type: string
    type: object
  models.Day:
    properties:
      date:
        type: string
      quantity:
        type: integer
    type: object
  models.List-models_ApiKey:
    properties:
      items:
        items:
          $ref: '#/definitions/models.ApiKey'
        type: array
    type: object
  models.List-models_Day:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Day'
        type: array
    type: object
  models.List-models_Track:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Track'
        type: array
    type: object
  models.ResponseModel:
    properties:
      details:
        example: email is invalid
        type: string
      message:
        example: invalid
        type: string
    type: object
  models.SignIn:
    properties:
      challenge:
        type: string
      email:
        type: string
      signed_challenge:
        type: string
    type: object
  models.Track:
    properties:
      created_at:
        type: string
      delete_at:
        type: string
