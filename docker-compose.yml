services:
  daytrack:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=3000
      - DB_PATH=/data/database.db
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - OPAQUE_SALT_NONCE=${OPAQUE_SALT_NONCE:-change-me}
      - OPAQUE_CHALLENGE_RANGE=${OPAQUE_CHALLENGE_RANGE:-100000}
      - JWT_ACCESS_TOKEN_DURATION=15m
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-3}
      - RATE_LIMIT_INTERVAL=${RATE_LIMIT_INTERVAL:-1s}
      - DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
    volumes:
      - daytrack_data:/data

volumes:
  daytrack_data:
